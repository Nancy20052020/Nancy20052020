name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Render all-time stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_github_stats.py
      - name: Commit updated cards
        run: |
          git add assets/github-stats-light.png assets/github-stats-dark.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh all-time GitHub stats"
          git push
